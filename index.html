<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selfwork - Countdown</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="countdown-card text-center" aria-labelledby="pageTitle">
            <p class="eyebrow mb-2">SELFWORK · ES. CHIAMATE ASINCRONE</p>
            <h1 id="pageTitle" class="mb-4">Countdown</h1>

            <label for="secondsInput" class="form-label">Quanti secondi vuoi contare?</label>
            <div class="input-group mb-4">
                <input
                    type="number"
                    class="form-control seconds-input"
                    id="secondsInput"
                    min="1"
                    step="1"
                    placeholder="Es. 30"
                    inputmode="numeric"
                >
                <span class="input-group-text">secondi</span>
            </div>

            <div id="timerDisplay" class="timer-display" role="timer" aria-live="off">00:00</div>
            <p id="statusMessage" class="status-message" role="status" aria-live="polite">
                Inserisci i secondi e premi Avvia.
            </p>

            <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">
                <button type="button" id="startButton" class="btn btn-custom">Avvia / Riprendi</button>
                <button type="button" id="pauseButton" class="btn btn-custom btn-pause" disabled>Pausa</button>
                <button type="button" id="resetButton" class="btn btn-custom btn-reset">Azzera</button>
            </div>

            <p class="hint mt-4 mb-0">In pausa? Premi <strong>Avvia / Riprendi</strong> per continuare da dove eri arrivato.</p>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="main.js"></script>
</body>
</html>
